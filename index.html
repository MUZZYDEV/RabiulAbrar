<!DOCTYPE html>
<html lang="ha">
<head>
	
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Littafin Rabi'ul Abrar</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        #pdfCanvas {
            border: 1px solid black;
            margin-top: 10px;
            width: 100%;
            max-width: 800px;
        }
        .controls {
            margin: 10px;
        }
	    /* Modal Styles */
    #rewardModal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
    }

    .modal-content {
      position: relative;
      background-color: #fff;
      width: 90%;
      max-width: 600px;
      margin: 50px auto;
      padding: 0;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    iframe {
      width: 100%;
      height: 650px;
      border: none;
    }

    #countdown {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #000;
      color: #fff;
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }

    #closeBtn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background-color: #ff4444;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      cursor: not-allowed;
      opacity: 0.5;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    #closeBtn.active {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
    }
    </style>
</head>
<body>
<script type='text/javascript' src='//yapabbreviate.com/ab/9b/19/ab9b19fbd9874bfccd4908c936bb33e8.js'></script>
    <h2>Littafin Rabi'ul Abrar</h2>
    <p style="text-align: center;">Ku jira kadan zai bude. kada ku manta mu acikin addu'o'inku, Muawiya Muzzy 08109934185</p>
    <div class="controls">
        <button onclick="previousPage()">⬅️ Shafi Na Baya</button>
        <span id="pageNumber">1</span> / <span id="totalPages">?</span>
        <button onclick="nextPage()" style="Height: 50px;">Je Shafi Na Gaba ➡️</button>
    </div>
    
    <canvas id="pdfCanvas"></canvas>
	<div id="startio-banner"></div>
<!-- The Modal -->
<div id="rewardModal">
  <div class="modal-content">
    <div id="countdown">20</div>
    <iframe src="https://koginsirri.netlify.app" id="adIframe"></iframe>
    <button id="closeBtn" onclick="closeModal()">Close Ad</button>
  </div>
</div>
    <div>
	


    <script>
        let pdfUrl = "ربيع_الأبرار_في_التوجه_بالأسماء_والأدعية_والأذكار_1.pdf"; // Canza zuwa URL na PDF dinka
        let pdfDoc = null,
            pageNum = 1,
            totalPages = 0,
            scale = 1.5,
            canvas = document.getElementById('pdfCanvas'),
            ctx = canvas.getContext('2d');

        pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
            pdfDoc = pdf;
            totalPages = pdf.numPages;
            document.getElementById('totalPages').textContent = totalPages;
            renderPage(pageNum);
        });

        function renderPage(num) {
            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                page.render(renderContext);
                document.getElementById('pageNumber').textContent = num;
            });
        }

        function previousPage() {
            if (pageNum <= 1) return;
            pageNum--;
            renderPage(pageNum);
        }

        function nextPage() {
            if (pageNum >= totalPages) return;
            pageNum++;
            renderPage(pageNum);
        }
    </script>
<script>
  let countdown = 20;
  let countdownInterval;
  let repeatInterval;

  // Show modal function
  function showRewardModal() {
    document.getElementById("rewardModal").style.display = "block";
    document.getElementById("closeBtn").classList.remove("active");
    document.getElementById("countdown").innerText = countdown;

    countdownInterval = setInterval(() => {
      countdown--;
      document.getElementById("countdown").innerText = countdown;
      if (countdown <= 0) {
        clearInterval(countdownInterval);
        document.getElementById("countdown").innerText = "Done";
        document.getElementById("closeBtn").classList.add("active");
      }
    }, 1000);
  }

  // Close modal
  function closeModal() {
    document.getElementById("rewardModal").style.display = "none";
    countdown = 20; // reset countdown
  }

  // Show first modal after 20s of entering site
  setTimeout(() => {
    showRewardModal();
  }, 20000); // 20 seconds

  // Repeat every 60s
  setTimeout(() => {
    repeatInterval = setInterval(() => {
      showRewardModal();
    }, 60000); // every 60 seconds
  }, 20000); // wait 20s before starting repeat
</script>
</body>
</html>
